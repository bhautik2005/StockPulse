services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-StockPulse}
      POSTGRES_USER: ${POSTGRES_USER:-bhautik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhautik}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - stockpulse

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bhautik}:${POSTGRES_PASSWORD:-bhautik}@db:5432/${POSTGRES_DB:-StockPulse}
      JWT_SECRET: ${JWT_SECRET:-local-docker-development-secret-change-before-deploy}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "5000:5000"
    networks:
      - stockpulse

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_CSRF_COOKIE: ${VITE_CSRF_COOKIE:-sp_csrf}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    networks:
      - stockpulse

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    networks:
      - stockpulse

networks:
  stockpulse:
    driver: bridge
